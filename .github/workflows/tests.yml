name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  phpunit:
    name: PHPUnit Tests
    runs-on: ubuntu-latest

    services:
      mailhog:
        image: mailhog/mailhog
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, mbstring
          coverage: xdebug

      - name: Fetch PHPMailer
        run: |
          curl -L https://github.com/PHPMailer/PHPMailer/archive/refs/tags/v7.0.2.zip -o phpmailer.zip
          unzip phpmailer.zip
          mkdir -p lib
          mv PHPMailer-7.0.2 lib/PHPMailer
          rm phpmailer.zip

      - name: Install PHPUnit
        run: |
          curl -L https://phar.phpunit.de/phpunit-10.phar -o phpunit
          chmod +x phpunit

      - name: Run PHPUnit tests
        run: ./phpunit

  e2e:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    services:
      mailhog:
        image: mailhog/mailhog
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, mbstring
          coverage: none

      - name: Fetch PHPMailer
        run: |
          curl -L https://github.com/PHPMailer/PHPMailer/archive/refs/tags/v7.0.2.zip -o phpmailer.zip
          unzip phpmailer.zip
          mkdir -p lib
          mv PHPMailer-7.0.2 lib/PHPMailer
          rm phpmailer.zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Create data directory
        run: mkdir -p data

      - name: Wait for Mailhog
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8025/api/v2/messages > /dev/null; then
              echo "Mailhog is ready"
              exit 0
            fi
            echo "Waiting for Mailhog... ($i/30)"
            sleep 1
          done
          echo "Mailhog failed to start"
          exit 1

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          BROWSER: ${{ matrix.browser }}

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

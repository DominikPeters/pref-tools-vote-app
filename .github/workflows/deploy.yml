name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list what would be uploaded
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to pref.tools/vote
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: npm ci && npm run build

      # The app is served from the /vote/ subfolder in production.
      - name: Set RewriteBase for subfolder deployment
        run: |
          sed -i -e 's|^# RewriteBase /vote/|RewriteBase /vote/|' \
                 -e 's|^RewriteBase /$|# RewriteBase /|' .htaccess
          grep -n RewriteBase .htaccess

      # Upload hashed assets before the PHP/manifest update. A state file per
      # revision keeps previous hashes available to already-open/cached pages.
      - name: Upload frontend assets via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: w008ef9a.kasserver.com
          port: 21
          protocol: ftp
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: assets/build/
          server-dir: vote/assets/build/
          state-name: .ftp-assets-${{ github.sha }}.json
          dry-run: ${{ inputs.dry_run == true }}
          exclude: |
            .vite/**

      # Upload PHP and the new manifest after its assets are present. Runtime
      # config, databases and server-installed libraries are excluded.
      # Settings mirror the working FTP deploys in tikz-editor (same host, the
      # FTP user's root is pref.tools/).
      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: w008ef9a.kasserver.com
          port: 21
          protocol: ftp
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: vote/
          dry-run: ${{ inputs.dry_run == true }}
          exclude: |
            **/.git*
            **/.git*/**
            .claude/**
            .github/**
            .gemini-clipboard/**
            site/**
            tests/**
            e2e/**
            scripts/**
            data/**
            config/config.php
            config/config.test.php
            node_modules/**
            assets/build/assets/**
            lib/PHPMailer/**
            package.json
            package-lock.json
            vite.config.mjs
            phpunit.xml
            playwright.config.js
            AGENTS.md
            CLAUDE.md
            GEMINI.md
            E2E-OBSERVATIONS.md
            PRIVACY.md
            background.md
            i18n-instructions.md
            implementation-plan.md
            *.docx
            *.pdf
